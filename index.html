<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Happy New Year Cô Trinh của anh ^^ 🎄</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="snow"></canvas>

<section class="hero">
  <h1 id="typing"></h1>
</section>

<section class="gallery hidden" id="gallery">
  <h2>✨ Những khoảnh khắc của em ✨</h2>

  <div class="slider">
    <img src="music/image1.jpg" class="active" />
    <img src="music/image18.jpg" />
    <img src="music/image19.jpg" />
    <img src="music/image2.jpg" />
    <img src="music/image3.jpg" />
    <img src="music/image4.jpg" />
    <img src="music/image10.jpg" />
    <img src="music/image11.jpg" />
    <img src="music/image12.jpg" />
    <img src="music/image13.jpg" />
    <img src="music/image15.jpg" />
    <img src="music/image16.jpg" />
  </div>
</section>

<section class="reasons">
  <ul id="reasonList"></ul>
</section>

<section class="gift">
  <button id="giftBtn">🎁 Click để mở quà</button>
</section>

<section class="final hidden" id="finalMessage">
  <div class="heart"></div>
<h2>🎆 Happy New Year 2026 🎆</h2>
<p>
  Mong rằng năm mới sẽ mang đến cho em<br />
  thật nhiều niềm vui, may mắn và những điều tuyệt vời nhất 💖
</p>
</section>

<audio id="music"></audio>

<div id="musicToggle" class="music-toggle">🔇</div>

<!-- GIFT IMAGE + FIREWORKS -->
<div id="giftReveal" class="gift-reveal hidden"></div>

<script src="script.js"></script>
</body>

<!-- Noel Decorations -->
<div id="angelLeft" class="side-angel left hidden">
  <img src="music/image23.png" alt="Angel Left"     
  style="
      width: 320px;
      max-width: none;
      filter: drop-shadow(0 0 40px rgba(255,255,255,1));
    "/>
</div>

<div id="angelRight" class="side-angel right hidden">
  <img src="music/image24.png" alt="Angel Right"   
  style="
      width: 320px;
      max-width: none;
      filter: drop-shadow(0 0 40px rgba(255,255,255,1));
    "/>
</div>
</html>
